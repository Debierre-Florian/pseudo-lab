# Optionnel : empêche Supabase (offre gratuite) de mettre le projet en pause après 1 semaine sans activité.
# Dans GitHub : Settings › Secrets and variables › Actions › ajoute SUPABASE_URL et SUPABASE_ANON_KEY.
name: keepalive
on:
  schedule: [{ cron: '17 6 * * 1,4' }]   # lundi et jeudi
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/programs?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -o /dev/null
